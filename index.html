    <!-- JSON-LD: FAQ (rich results in Google) — mirrors src/data.ts FAQ_DATA, which is what
         FAQ.tsx actually renders on the homepage. Keep these in sync; a mismatch here risks
         losing the FAQ rich result under Google's structured-data guidelines. -->
    <script type="application/ld+json" id="faqpage-schema">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Wat is tvpikoma IPTV en hoe werkt het precies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "tvpikoma is een premium IPTV provider die televisie via het internet streamt. Je hebt geen schotel of coax-kabels meer nodig. Met ons abonnement krijg je via een handige app op je Smart TV, telefoon, tablet of computer direct toegang tot meer dan 20.000+ live zenders, waaronder alle Nederlandse zenders, sportkanalen (ESPN, Ziggo, Viaplay) en een enorme bibliotheek aan films en series (VOD)."
          }
        },
        {
          "@type": "Question",
          "name": "Is de installatie ingewikkeld en welke apparaten worden ondersteund?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nee, de installatie is heel eenvoudig en binnen 5 minuten gepiept! tvpikoma werkt op vrijwel elk apparaat: Smart TV's (Samsung, LG, Sony met apps zoals IPTV Smarters, Flix IPTV of IBOTV), Amazon Fire TV Stick, Android TV boxen, Apple TV, smartphones (iOS/Android), tablets, Chromecast en PC. Na bestelling sturen we je een heldere, stap-voor-stap handleiding per e-mail toe, en onze support helpt je direct via WhatsApp als je er niet uitkomt."
          }
        },
        {
          "@type": "Question",
          "name": "Zit ik vast aan een langdurig contract of abonnement?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absoluut niet. Bij tvpikoma hanteren we uitsluitend flexibele pre-paid pakketten. Je kiest zelf of je 1, 3, 6 of 12 maanden wilt kijken. Na deze periode stopt het abonnement automatisch, tenzij je er zelf voor kiest om te verlengen. Geen automatische incasso's en geen stilzwijgende verlengingen. Je zit dus nergens aan vast!"
          }
        },
        {
          "@type": "Question",
          "name": "Hoe snel wordt mijn IPTV account geactiveerd?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wij leveren extreem snel! Onze systemen activeren je account direct na ontvangst van de betaling. De inloggegevens (M3U playlist link en Xtream Codes API serverdetails) worden automatisch binnen 3 tot 5 minuten naar je e-mailadres verzonden. Mocht je binnen 10 minuten niks hebben ontvangen, controleer dan je spambox of stuur ons direct een berichtje via WhatsApp!"
          }
        },
        {
          "@type": "Question",
          "name": "Heb ik speciale internet-snelheden nodig voor buffer-vrij 4K/UHD streamen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Om soepel in 4K/UHD te streamen raden we een stabiele internetverbinding aan van ten minste 25 Mbps. Voor HD/FHD streams is 15 Mbps al ruim voldoende. Onze innovatieve servers gebruiken geavanceerde compressietechnologie en H.265 codecs, waardoor de streams stabiel blijven en buffering nagenoeg verleden tijd is."
          }
        },
        {
          "@type": "Question",
          "name": "Kan ik het tvpikoma abonnement op meerdere apparaten tegelijkertijd gebruiken?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standaard is ons abonnement geschikt voor 1 apparaat tegelijk (1 actieve stream). Mocht je op meerdere TV's of apparaten tegelijk in huis willen kijken, dan kun je in onze prijsconfigurator eenvoudig upgraden naar 2, 3 of 4 schermen voor je gehele huishouden tegen een flinke korting."
          }
        },
        {
          "@type": "Question",
          "name": "Welke betaalmethoden ondersteunen jullie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Omdat we ons richten op de Nederlandse en Belgische markt bieden we extreem veilige en vertrouwde nationale betaalmethoden aan. Je kunt probleemloos betalen via iDEAL (met alle Nederlandse banken zoals ING, Rabobank, ABN, etc.), Bancontact (voor onze Belgische klanten), PayPal en Creditcard (Visa/Mastercard)."
          }
        }
      ]
    }
    </script>
